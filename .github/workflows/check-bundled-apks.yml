# Runs the same two scripts the release job runs, so a change to a pinned
# version, a hash or a certificate is caught on the pull request rather than
# when a tag is pushed. Nothing here signs or publishes anything: no keystore,
# no Gradle, no release upload.
name: Bundled APKs

on:
  pull_request:
    paths:
      - ".github/scripts/fetch-companion-apks.sh"
      - ".github/scripts/verify-bundled-apks.sh"
      - ".github/workflows/check-bundled-apks.yml"
      - ".github/workflows/release.yml"
      - "anonomi-android/src/official/assets/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # No submodules: the Postbox APK is a committed asset and nothing here
      # builds from source.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the companion APKs
        run: .github/scripts/fetch-companion-apks.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify the companion APKs
        run: .github/scripts/verify-bundled-apks.sh
