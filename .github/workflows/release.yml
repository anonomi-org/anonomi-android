name: Release (APK)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Tor Browser is fetched here rather than committed, so the repository does
      # not carry a 110 MB binary that every clone and mirror run has to pull.
      # Fetched from the archive host, not the dist host: dist serves only the
      # current release, so a pinned version there stops resolving as soon as the
      # next one ships.
      #
      # The SHA-256 is the gate. It pins the exact bytes of a download whose
      # OpenPGP signature was checked against the Tor Browser Developers key
      # (EF6E286DDA85EA2A4BA7DE684E2C6E8793298290) when the version was last
      # raised, so re-checking the signature here could not tell us anything the
      # hash does not already guarantee - and it would tie every future release
      # to that key's expiry date. Verify the signature when you change the
      # version below, not on every build.
      - name: Fetch Tor Browser for the official flavour
        env:
          TB_VERSION: "15.0.19"
          TB_ABI: "aarch64"
          TB_SHA256: "4982ff6e9eb1075f6035acae84aafcd70e4b9a70e72499af2476e6c1852516d0"
        run: |
          set -euo pipefail
          base="https://archive.torproject.org/tor-package-archive/torbrowser/${TB_VERSION}"
          apk="tor-browser-android-${TB_ABI}-${TB_VERSION}.apk"
          dest="anonomi-android/src/official/assets"
          curl -fsSL --retry 3 --retry-delay 5 -o "${dest}/${apk}" "${base}/${apk}"
          echo "${TB_SHA256}  ${dest}/${apk}" | sha256sum -c -
          mv "${dest}/${apk}" "${dest}/tor-browser.apk"
          ls -l "${dest}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      # Write keystore to disk
      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/anonomi.keystore"

      # Build signed release APKs.
      # 'official' bundles the companion apps in src/official/assets; 'fdroid'
      # ships none of them, and is the variant F-Droid reproduces from source
      # (metadata/org.anonomi.android.yml -> gradle: [fdroid]). Both must be
      # published: the F-Droid metadata's Binaries: URL points at the fdroid APK.
      - name: Build Anonomi APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/anonomi.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :anonomi-android:assembleOfficialRelease \
                    :anonomi-android:assembleFdroidRelease

      # Build postbox
      - name: Build Mailbox APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/anonomi.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./anonomi-postbox/gradlew
          cd anonomi-postbox
          ./gradlew :postbox-android:assembleRelease

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist

          echo "Anonomi APKs:"
          ls -lah anonomi-android/build/outputs/apk/official/release/
          ls -lah anonomi-android/build/outputs/apk/fdroid/release/
          cp anonomi-android/build/outputs/apk/official/release/*.apk dist/
          cp anonomi-android/build/outputs/apk/fdroid/release/*.apk dist/

          echo "Postbox APKs:"
          ls -lah anonomi-postbox/postbox-android/build/outputs/apk/release/
          cp anonomi-postbox/postbox-android/build/outputs/apk/release/*.apk dist/

          echo "Collected:"
          ls -lah dist

      # Signature check must not rely on filenames. anonomi-android/build.gradle
      # sets outputFileName for every release build of official/fdroid, so an
      # UNSIGNED apk is still written as anonomi-<flavour>-release.apk -- the old
      # '-unsigned.apk' grep could never fire and would have published unsigned
      # APKs if the keystore secrets were absent. Ask apksigner instead.
      - name: Verify release APKs are signed
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::neither ANDROID_HOME nor ANDROID_SDK_ROOT is set"
            exit 1
          fi
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "Using $APKSIGNER"

          # F-Droid pins this in AllowedAPKSigningKeys; a mismatch breaks their
          # verification. Update here and in fdroiddata together on key rotation.
          EXPECTED_SHA256="0c42c2a2e9be889eef2e7da10e8cd9cc71e6e6bc0e676fc994a8066d1766cb8d"

          fail=0
          for apk in dist/*.apk; do
            name="$(basename "$apk")"
            if ! "$APKSIGNER" verify --print-certs "$apk" > /tmp/sig.txt 2>&1; then
              echo "::error::UNSIGNED or INVALID signature: $name"
              cat /tmp/sig.txt
              fail=1
              continue
            fi
            sha="$(grep -m1 -i 'certificate SHA-256 digest' /tmp/sig.txt | awk '{print $NF}')"
            echo "signed OK: $name (SHA-256 $sha)"
            case "$name" in
              anonomi-official-release.apk|anonomi-fdroid-release.apk)
                if [ "$sha" != "$EXPECTED_SHA256" ]; then
                  echo "::error::$name signing key $sha != AllowedAPKSigningKeys $EXPECTED_SHA256"
                  fail=1
                fi
                ;;
            esac
          done

          # Both Anonomi variants must be present: official for direct download,
          # fdroid as the reference binary F-Droid reproduces against.
          for required in anonomi-official-release.apk anonomi-fdroid-release.apk; do
            if [ ! -f "dist/$required" ]; then
              echo "::error::missing dist/$required"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "Release artifacts failed verification - not publishing."
            exit 1
          fi

      - name: Create GitHub Release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
